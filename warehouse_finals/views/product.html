
<section class="panel" id="panel-product" hidden>
  <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-end gap-2 mb-3">
    <div>
      <h1 class="h3">Products</h1>
      <p class="text-muted mb-0">Items tracked in the warehouse, each tied to a category.</p>
    </div>
    <button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#productModal" data-module="product"><i class="bi bi-plus-lg me-1"></i>Add Product</button>
  </div>
  <div class="card">
    <div class="table-responsive">
      <table class="table table-hover mb-0 align-middle">
        <thead class="table-light">
          <tr><th>Product Name</th><th>Category</th><th>Unit</th><th>Unit Price</th><th>In Stock</th><th>Reorder Lvl</th><th>Status</th><th class="text-end text-nowrap">Actions</th></tr>
        </thead>
        <tbody id="productTable"></tbody>
      </table>
    </div>
  </div>
</section>

<div class="modal fade" id="productModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="productForm">
        <div class="modal-header">
          <h5 class="modal-title" id="productModalTitle">Add Product</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="product_id">
          <div class="mb-3">
            <label class="form-label">Product Name</label>
            <input type="text" class="form-control" id="product_name" required placeholder="e.g. Bond Paper A4">
          </div>
          <div class="mb-3">
            <label class="form-label">Category</label>
            <select class="form-select" id="product_category_id" required></select>
          </div>
          <div class="row">
            <div class="col mb-3">
              <label class="form-label">Unit of Measure</label>
              <input type="text" class="form-control" id="unit_measure" required placeholder="e.g. Box, Piece, Ream">
            </div>
            <div class="col mb-3">
              <label class="form-label">Unit Price</label>
              <input type="number" class="form-control" id="unit_price" step="0.01" min="0" required placeholder="0.00">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Reorder Level</label>
            <input type="number" class="form-control" id="reorder_level" min="0" required placeholder="e.g. 20">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-dark">Save Product</button>
        </div>
      </form>
    </div>
  </div>
</div>

<template id="tmpl-row-product">
  <tr>
    <td><strong class="row-name"></strong></td>
    <td class="row-cat"></td>
    <td class="row-unit"></td>
    <td class="font-monospace row-price"></td>
    <td class="font-monospace row-stock"></td>
    <td class="row-reorder"></td>
    <td class="row-status"></td>
    <td class="text-end text-nowrap row-actions"></td>
  </tr>
</template>
