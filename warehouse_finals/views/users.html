
<section class="panel" id="panel-users" hidden>
  <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-end gap-2 mb-3">
    <div>
      <h1 class="h3">Users</h1>
      <p class="text-muted mb-0">Accounts for staff who operate the warehouse system.</p>
    </div>
    <button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#userModal" data-module="users"><i class="bi bi-plus-lg me-1"></i>Add User</button>
  </div>
  <div class="card">
    <div class="table-responsive">
      <table class="table table-hover mb-0 align-middle">
        <thead class="table-light">
          <tr><th>Username</th><th>Full Name</th><th>Role</th><th>Contact</th><th>Status</th><th class="text-end text-nowrap">Actions</th></tr>
        </thead>
        <tbody id="userTable"></tbody>
      </table>
    </div>
  </div>
</section>

<div class="modal fade" id="userModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="userForm">
        <div class="modal-header">
          <h5 class="modal-title" id="userModalTitle">Add User</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="user_id">
          <div class="row">
            <div class="col mb-3">
              <label class="form-label">First Name</label>
              <input type="text" class="form-control" id="first_name" required placeholder="Juan">
            </div>
            <div class="col mb-3">
              <label class="form-label">Last Name</label>
              <input type="text" class="form-control" id="last_name" required placeholder="Dela Cruz">
            </div>
          </div>
          <div class="row">
            <div class="col mb-3">
              <label class="form-label">Username</label>
              <input type="text" class="form-control" id="username" required placeholder="e.g. employee.username">
            </div>
            <div class="col mb-3">
              <label class="form-label">Role</label>
              <select class="form-select" id="user_role_id" required></select>
            </div>
          </div>
          <div class="mb-3" id="passwordFieldLabel">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="password" placeholder="At least 4 characters">
          </div>
          <div class="mb-3">
            <label class="form-label">Contact Number</label>
            <input type="text" class="form-control" id="contact_number" placeholder="09171234567">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-dark">Save User</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="modal fade" id="resetPwdModal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <form id="resetPwdForm">
        <div class="modal-header">
          <h5 class="modal-title">Reset Password</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="reset_user_id">
          <div class="mb-3">
            <label class="form-label">New Password</label>
            <input type="password" class="form-control" id="new_password" required placeholder="At least 12 characters">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-dark">Reset Password</button>
        </div>
      </form>
    </div>
  </div>
</div>

<template id="tmpl-row-user">
  <tr>
    <td><strong class="row-username"></strong></td>
    <td class="row-name"></td>
    <td class="row-role"></td>
    <td class="row-email"></td>
    <td class="row-status"></td>
    <td class="text-end text-nowrap row-actions"></td>
  </tr>
</template>
