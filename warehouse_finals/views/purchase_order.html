
<section class="panel" id="panel-purchase_order" hidden>
  <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-end gap-2 mb-3">
    <div>
      <h1 class="h3">Purchase Orders</h1>
      <p class="text-muted mb-0">Orders placed with suppliers for restock.</p>
    </div>
    <button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#poModal" data-module="purchase_order"><i class="bi bi-plus-lg me-1"></i>New Purchase Order</button>
  </div>
  <div class="card">
    <div class="table-responsive">
      <table class="table table-hover mb-0 align-middle">
        <thead class="table-light">
          <tr><th>Supplier</th><th>Ordered By</th><th>Order Date</th><th>Items</th><th>Total Cost</th><th>Status</th><th class="text-end text-nowrap">Actions</th></tr>
        </thead>
        <tbody id="poTable"></tbody>
      </table>
    </div>
  </div>
</section>

<div class="modal fade" id="poModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <form id="poForm">
        <div class="modal-header">
          <h5 class="modal-title">New Purchase Order</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row">
            <div class="col mb-3">
              <label class="form-label">Supplier</label>
              <select class="form-select" id="po_supplier_id" required></select>
            </div>
            <div class="col mb-3">
              <label class="form-label">Processed By</label>
              <select class="form-select" id="po_user_id" required></select>
            </div>
            <div class="col mb-3">
              <label class="form-label">Order Date</label>
              <input type="date" class="form-control" id="po_order_date" required>
            </div>
          </div>
          <hr>
          <div class="row g-2 align-items-end">
            <div class="col-5">
              <label class="form-label">Product</label>
              <select class="form-select" id="po_item_product"></select>
            </div>
            <div class="col-2">
              <label class="form-label">Qty</label>
              <input type="number" class="form-control" id="po_item_qty" min="1" value="1">
            </div>
            <div class="col-3">
              <label class="form-label">Unit Cost</label>
              <input type="number" class="form-control" id="po_item_cost" min="0" step="0.01" placeholder="0.00">
            </div>
            <div class="col-2">
              <button type="button" class="btn btn-outline-dark w-100" onclick="addLineItem('po')">Add</button>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table table-sm mt-3">
              <thead><tr><th>Product</th><th>Qty</th><th>Unit Cost</th><th>Subtotal</th><th></th></tr></thead>
              <tbody id="po_items_table"></tbody>
            </table>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-dark">Save Purchase Order</button>
        </div>
      </form>
    </div>
  </div>
</div>

<template id="tmpl-row-po">
  <tr>
    <td class="row-supplier"></td>
    <td class="row-by"></td>
    <td class="row-date"></td>
    <td class="row-items"></td>
    <td class="font-monospace row-cost"></td>
    <td class="row-status"></td>
    <td class="text-end text-nowrap row-actions"></td>
  </tr>
</template>

<template id="tmpl-line-item-po">
  <tr>
    <td class="line-product"></td>
    <td class="line-qty"></td>
    <td class="line-cost"></td>
    <td class="line-subtotal"></td>
    <td class="text-end line-action"></td>
  </tr>
</template>

<template id="tmpl-btn-cancel-po">
  <button type="button" class="btn btn-sm btn-outline-danger" title="Cancel Purchase Order"><i class="bi bi-x-circle me-1"></i>Cancel</button>
</template>
