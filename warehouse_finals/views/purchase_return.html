
<section class="panel" id="panel-purchase_return" hidden>
  <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-end gap-2 mb-3">
    <div>
      <h1 class="h3">Purchase Returns</h1>
      <p class="text-muted mb-0">Stock sent back to a supplier (damaged, wrong item, etc.).</p>
    </div>
    <button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#preturnModal" data-module="purchase_return"><i class="bi bi-plus-lg me-1"></i>New Purchase Return</button>
  </div>
  <div class="card">
    <div class="table-responsive">
      <table class="table table-hover mb-0 align-middle">
        <thead class="table-light">
          <tr><th>Supplier</th><th>Returned By</th><th>Date</th><th>Reason</th><th>Items</th></tr>
        </thead>
        <tbody id="preturnTable"></tbody>
      </table>
    </div>
  </div>
</section>

<div class="modal fade" id="preturnModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <form id="preturnForm">
        <div class="modal-header">
          <h5 class="modal-title">New Purchase Return</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row">
            <div class="col mb-3">
              <label class="form-label">Supplier</label>
              <select class="form-select" id="preturn_supplier_id" required></select>
            </div>
            <div class="col mb-3">
              <label class="form-label">Processed By</label>
              <select class="form-select" id="preturn_user_id" required></select>
            </div>
            <div class="col mb-3">
              <label class="form-label">Return Date</label>
              <input type="date" class="form-control" id="preturn_date" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Reason</label>
            <input type="text" class="form-control" id="preturn_reason" placeholder="e.g. Damaged on arrival">
          </div>
          <hr>
          <div class="row g-2 align-items-end">
            <div class="col-7">
              <label class="form-label">Product</label>
              <select class="form-select" id="preturn_item_product"></select>
            </div>
            <div class="col-3">
              <label class="form-label">Qty</label>
              <input type="number" class="form-control" id="preturn_item_qty" min="1" value="1">
            </div>
            <div class="col-2">
              <button type="button" class="btn btn-outline-dark w-100" onclick="addLineItem('preturn')">Add</button>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table table-sm mt-3">
              <thead><tr><th>Product</th><th>Qty</th><th></th></tr></thead>
              <tbody id="preturn_items_table"></tbody>
            </table>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-dark">Save Purchase Return</button>
        </div>
      </form>
    </div>
  </div>
</div>

<template id="tmpl-row-preturn">
  <tr>
    <td class="row-supplier"></td>
    <td class="row-by"></td>
    <td class="row-date"></td>
    <td class="row-reason"></td>
    <td class="row-items"></td>
  </tr>
</template>
