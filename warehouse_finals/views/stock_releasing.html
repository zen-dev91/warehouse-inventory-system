
<section class="panel" id="panel-stock_releasing" hidden>
  <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-end gap-2 mb-3">
    <div>
      <h1 class="h3">Stock Releasing</h1>
      <p class="text-muted mb-0">Stock released from the warehouse to an internal requester.</p>
    </div>
    <button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#releasingModal" data-module="stock_releasing"><i class="bi bi-plus-lg me-1"></i>Release Stock</button>
  </div>
  <div class="card">
    <div class="table-responsive">
      <table class="table table-hover mb-0 align-middle">
        <thead class="table-light">
          <tr><th>Requested By</th><th>Released By</th><th>Date</th><th>Items</th></tr>
        </thead>
        <tbody id="releasingTable"></tbody>
      </table>
    </div>
  </div>
</section>

<div class="modal fade" id="releasingModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <form id="releasingForm">
        <div class="modal-header">
          <h5 class="modal-title">Release Stock</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row">
            <div class="col mb-3">
              <label class="form-label">Requested By</label>
              <input type="text" class="form-control" id="releasing_requested_by" required placeholder="e.g. Branch 2 / Ana Reyes">
            </div>
            <div class="col mb-3">
              <label class="form-label">Released By</label>
              <select class="form-select" id="releasing_user_id" required></select>
            </div>
            <div class="col mb-3">
              <label class="form-label">Releasing Date</label>
              <input type="date" class="form-control" id="releasing_date" required>
            </div>
          </div>
          <hr>
          <div class="row g-2 align-items-end">
            <div class="col-7">
              <label class="form-label">Product</label>
              <select class="form-select" id="releasing_item_product"></select>
            </div>
            <div class="col-3">
              <label class="form-label">Qty</label>
              <input type="number" class="form-control" id="releasing_item_qty" min="1" value="1">
            </div>
            <div class="col-2">
              <button type="button" class="btn btn-outline-dark w-100" onclick="addLineItem('releasing')">Add</button>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table table-sm mt-3">
              <thead><tr><th>Product</th><th>Qty</th><th></th></tr></thead>
              <tbody id="releasing_items_table"></tbody>
            </table>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-dark">Save Releasing</button>
        </div>
      </form>
    </div>
  </div>
</div>

<template id="tmpl-row-releasing">
  <tr>
    <td><strong class="row-to"></strong></td>
    <td class="row-by"></td>
    <td class="row-date"></td>
    <td class="row-items"></td>
  </tr>
</template>
