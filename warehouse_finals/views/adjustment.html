
<section class="panel" id="panel-adjustment" hidden>
  <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-end gap-2 mb-3">
    <div>
      <h1 class="h3">Stock Adjustments</h1>
      <p class="text-muted mb-0">Manual corrections to on-hand quantity (count discrepancies, breakage, etc.) not caused by a purchase, receiving, releasing, or return.</p>
    </div>
    <button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#adjustmentModal" data-module="adjustment"><i class="bi bi-plus-lg me-1"></i>New Adjustment</button>
  </div>
  <div class="card">
    <div class="table-responsive">
      <table class="table table-hover mb-0 align-middle">
        <thead class="table-light">
          <tr><th>Adjusted By</th><th>Date</th><th>Reason</th><th>Items</th></tr>
        </thead>
        <tbody id="adjustmentTable"></tbody>
      </table>
    </div>
  </div>
</section>

<div class="modal fade" id="adjustmentModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <form id="adjustmentForm">
        <div class="modal-header">
          <h5 class="modal-title">New Stock Adjustment</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row">
            <div class="col mb-3">
              <label class="form-label">Processed By</label>
              <select class="form-select" id="adjustment_user_id" required></select>
            </div>
            <div class="col mb-3">
              <label class="form-label">Adjustment Date</label>
              <input type="date" class="form-control" id="adjustment_date" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Reason</label>
            <input type="text" class="form-control" id="adjustment_reason" placeholder="e.g. Physical count discrepancy">
          </div>
          <hr>
          <div class="row g-2 align-items-end">
            <div class="col-5">
              <label class="form-label">Product</label>
              <select class="form-select" id="adjustment_item_product"></select>
            </div>
            <div class="col-2">
              <label class="form-label">Qty</label>
              <input type="number" class="form-control" id="adjustment_item_qty" min="1" value="1">
            </div>
            <div class="col-3">
              <label class="form-label">Type</label>
              <select class="form-select" id="adjustment_item_type">
                <option value="Addition">Addition</option>
                <option value="Deduction">Deduction</option>
              </select>
            </div>
            <div class="col-2">
              <button type="button" class="btn btn-outline-dark w-100" onclick="addLineItem('adjustment')">Add</button>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table table-sm mt-3">
              <thead><tr><th>Product</th><th>Qty</th><th>Type</th><th></th></tr></thead>
              <tbody id="adjustment_items_table"></tbody>
            </table>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-dark">Save Adjustment</button>
        </div>
      </form>
    </div>
  </div>
</div>

<template id="tmpl-row-adjustment">
  <tr>
    <td class="row-by"></td>
    <td class="row-date"></td>
    <td class="row-reason"></td>
    <td class="row-items"></td>
  </tr>
</template>

<template id="tmpl-line-item-adjustment">
  <tr>
    <td class="line-product"></td>
    <td class="line-qty"></td>
    <td class="line-type"></td>
    <td class="text-end line-action"></td>
  </tr>
</template>
